<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupersonicIQ - Sonic Healthcare Knowledge Assistant</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/supersonicIQ-192.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
  </style>
</head>
<body>
  <iframe id="app" src="http://localhost:8501" title="SupersonicIQ" allow="microphone"></iframe>
  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('ServiceWorker registered'))
          .catch(err => console.error('ServiceWorker registration failed:', err));
      });
    }

    // Check for install prompt (PWA install banner)
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('PWA Install prompt available');
    });

    // Check if already installed
    if (window.matchMedia('(display-mode: standalone)').matches) {
      console.log('Already installed as standalone app');
    }
  </script>
</body>
</html>
